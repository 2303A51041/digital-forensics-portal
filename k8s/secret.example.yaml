# EXAMPLE ONLY - do not commit a real secret.
# Create the real secret from the command line instead:
#   kubectl create secret generic forensics-secret -n forensics \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)"
# This file is not listed in kustomization.yaml, so "kubectl apply -k k8s/" never applies it.
apiVersion: v1
kind: Secret
metadata:
  name: forensics-secret
  namespace: forensics
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-value"
