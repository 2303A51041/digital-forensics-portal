name: Digital Forensics Portal CI/CD

on:
  push:
    branches: ["main", "react-mongodb"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/2303a51041/digital-forensics-portal

jobs:
  # 1. Install, run the API test suite against a real MongoDB, and build the React client.
  test:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/forensics_test

      - name: Build React client
        run: npm run build

      - name: Test summary
        run: |
          {
            echo "## Test and build"
            echo '```'
            node -v
            npm test -w server -- --test-reporter=spec 2>&1 | tail -n 30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/forensics_test

  # 2. Build the Docker image, smoke-test the container, deploy it to a throwaway
  #    Kubernetes (kind) cluster, then publish it to GitHub Container Registry.
  docker:
    name: Docker image and Kubernetes deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }},${{ env.IMAGE_NAME }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container with MongoDB
        run: |
          docker network create forensics-net
          docker run -d --name mongo --network forensics-net mongo:8.0
          docker run -d --name app --network forensics-net -p 5000:5000 \
            -e MONGODB_URI=mongodb://mongo:27017/forensics_db \
            -e JWT_SECRET=ci-only-secret ${IMAGE_NAME}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:5000/api/health | grep '"database":"connected"'
          curl -fsS http://localhost:5000/ | grep -qi '<div id="root">' && echo "React client served"
          curl -fsS -X POST http://localhost:5000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Forensics@123"}' | grep -q '"token"' && echo "Demo login OK"
          docker ps
          docker logs app
          {
            echo "## Docker image smoke test"
            echo '```'
            docker image ls ${IMAGE_NAME}
            echo
            docker ps --format 'table {{.Names}}	{{.Image}}	{{.Status}}	{{.Ports}}'
            echo
            echo "GET /api/health -> $(curl -fsS http://localhost:5000/api/health)"
            echo
            docker logs app 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: forensics

      - name: Deploy to Kubernetes
        run: |
          kind load docker-image ${IMAGE_NAME}:ci --name forensics
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret generic forensics-secret -n forensics \
            --from-literal=JWT_SECRET="$(openssl rand -hex 48)"
          kubectl apply -k k8s/
          kubectl set image deployment/forensics-app app=${IMAGE_NAME}:ci -n forensics
          kubectl rollout status statefulset/mongo -n forensics --timeout=300s
          kubectl rollout status deployment/forensics-app -n forensics --timeout=300s
          kubectl get pods,svc,pvc -n forensics -o wide

      - name: Verify Kubernetes service
        run: |
          kubectl port-forward -n forensics svc/forensics-app 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep '"database":"connected"'
          kubectl logs deployment/forensics-app -n forensics
          {
            echo "## Kubernetes deployment (kind cluster)"
            echo '```'
            kubectl version 2>/dev/null | head -2
            echo
            echo '$ kubectl get pods,svc,pvc -n forensics -o wide'
            kubectl get pods,svc,pvc -n forensics -o wide
            echo
            echo '$ kubectl rollout status deployment/forensics-app -n forensics'
            kubectl rollout status deployment/forensics-app -n forensics
            echo
            echo "GET http://localhost:8080/api/health (via port-forward to svc/forensics-app) -> $(curl -fsS http://localhost:8080/api/health)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n forensics || true
          kubectl describe pods -n forensics || true
          kubectl logs -n forensics -l app=forensics-app --tail=100 || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
